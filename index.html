    const rec = G.throwAndCount(r, idx);
    if (!rec) return;
    if (ui.rec) R.dealt(ui.rec, r, rec);
    save(); // B2: run save and record both hold the counted deal before the animation, so a reload mid-count keeps it
    ui.sel.clear(); ui.hint = null; ui.animating = true; ui.skip = false;
    const debuffed = new Set([...(rec.handRes.debuffed || []), ...(rec.cribRes ? rec.cribRes.debuffed : [])]);
    ui.zoneCards = { keep: rec.keep, crib: rec.crib, starter: null, houseHidden: true, debuffed, starterFlip: false, justFlipped: false };
    ui.msg = 'Cutting for the starter…';
    // show the throw with the old score still up, then reveal
    const scoreNow = b.score; b.score = before;
    render();
    await sleep(450);
    ui.zoneCards.starter = rec.starter; ui.zoneCards.starterFlip = true;
    ui.msg = rec.starter.rank === 11 ? 'A Jack! Two for his heels.' : 'Counting your hand.';
    render();
    await sleep(500);
    await animateCount(rec.handRes, ['handZone', 'starterZone'], 'Your hand');
    if (rec.cribRes) {
      ui.zoneCards.houseHidden = false; ui.zoneCards.justFlipped = true; ui.zoneCards.starterFlip = false;
      ui.msg = 'The House turns over its two cards. Counting your crib.';
      render();
      await sleep(550);
      ui.zoneCards.justFlipped = false;
      await animateCount(rec.cribRes, ['cribZone', 'starterZone'], 'Your crib');
    } else {
      ui.msg = 'The Dry Crib: your crib is not counted.';
      render(); await sleep(600);
    }
    b.score = scoreNow;
    ui.disp.title = 'This deal';
    ui.disp.total = `Hand ${fmt(rec.handRes.total)} + crib ${fmt(rec.cribRes ? rec.cribRes.total : 0)} = ${fmt(rec.gained)}`;
    const tt = $('#countTitle'), td = $('#dTot'); if (tt) tt.textContent = ui.disp.title; if (td) td.textContent = ui.disp.total;
    await animatePeg(before, scoreNow, b.target);
    ui.animating = false; ui.skip = false;
    ui.msg = b.phase === 'won' ? `Blind cleared with ${fmt(b.score)} of ${fmt(b.target)}.`
      : b.phase === 'lost' ? `Out of deals. ${fmt(b.score)} of ${fmt(b.target)}.`
      : `${fmt(b.target - b.score)} to go, ${b.deals} deal${b.deals === 1 ? '' : 's'} left.`;
    save();
    render();
  }

  function sortHand() { const b = ui.run.blind; if (b) b.hand.sort((a, c) => a.rank - c.rank || a.suit - c.suit); }

  // ---------------- Actions ----------------
  function act(a, el) {
    const r = ui.run;
    switch (a) {
      case 'play':
        G.startBlind(r); sortHand(); ui.screen = 'play'; ui.sel.clear(); ui.zoneCards = null; ui.backPeg = 0; ui.frontPeg = 0;
        if (ui.rec) R.blindStart(ui.rec, r, ui.speed);
        ui.disp = { points: 0, mult: 1, total: '', narr: '', title: 'The count' };
        ui.msg = r.blind.boss ? `${r.blind.boss.name}: ${r.blind.boss.text}.` : 'Pick 2 cards to throw to your crib, or select some to swap.';
        break;
      case 'swap':
        if (G.swap(r, [...ui.sel])) { ui.sel.clear(); ui.hint = null; sortHand(); ui.msg = 'Swapped.'; if (ui.rec) R.swap(ui.rec); }

      case 'hint': {

        if (ui.rec) R.hint(ui.rec, r, ui.hint);

        ui.msg = `Hint: throw ${E.label(h[i])} and ${E.label(h[j])}. Expect about ${fmt(Math.round(ui.hint.best.handEv))} from the hand and ${fmt(Math.round(ui.hint.best.cribEv))} from the crib.`;
        break;
      }
      case 'next':
        G.nextDeal(r); sortHand(); ui.zoneCards = null; ui.sel.clear();
        ui.disp = { points: 0, mult: 1, total: '', narr: '', title: 'The count' }; ui.msg = 'Pick 2 cards for your crib.';
        break;
      case 'cashout':
        ui.cash = G.cashOut(r); ui.screen = 'cashout'; ui.zoneCards = null;
        if (ui.rec) R.cashOut(ui.rec, r, ui.cash);

      case 'toshop':
        if (r.over) { ui.screen = 'over'; break; }
        G.openShop(r); ui.screen = 'shop'; ui.msg = '';
        if (ui.rec) R.shopOpen(ui.rec, r);
        break;
      case 'gameover': ui.screen = 'over'; break;
      case 'leaveshop':
        if (ui.rec) R.shopClose(ui.rec, r);
        ui.screen = 'blinds'; ui.selKib = -1; ui.selCons = -1; r.shop = null; ui.disp = { points: 0, mult: 1, total: '', narr: '' }; break;
      case 'reroll': if (G.reroll(r) && ui.rec) R.reroll(ui.rec, r); break;
      case 'buykib': {
        const def = r.shop.kibs[+el.dataset.i];
        if (!G.buyKib(r, +el.dataset.i)) ui.msg = 'Not enough money or no free slot.'; else { ui.msg = ''; if (ui.rec) R.bought(ui.rec, def, false); }
        break;
      }
      case 'buycons': {
        const def = r.shop.cons[+el.dataset.i];
        if (!G.buyCons(r, +el.dataset.i, false)) ui.msg = 'Not enough money or no free slot.'; else { ui.msg = ''; if (ui.rec) R.bought(ui.rec, def, false); }

  // Clipboard first; if the browser refuses, copy through a hidden textarea. The button says what happened.
  function copyText(text, el) {
    const say = ok => { if (el) { const was = el.textContent; el.textContent = ok ? 'Copied' : 'Copy failed: select the text below'; setTimeout(() => { el.textContent = was; }, 1500); } };

  // ---------------- Boot / persistence ----------------

  function newGame(seed, mode) {
    if (ui.rec && ui.rec.result === 'in-progress' && ui.run) { R.finish(ui.rec, ui.run, 'abandoned'); persistRecord(); }
    ui.run = G.newRun(seed == null ? undefined : seed);
    Object.assign(ui, { screen: 'blinds', sel: new Set(), selKib: -1, selCons: -1, zoneCards: null, hint: null, msg: '', cash: null,
      disp: { points: 0, mult: 1, total: '', narr: '' }, backPeg: 0, frontPeg: 0 });

  function snapshotState() {

    // continues exactly where the player was. A finished run always saves as 'over' (B1).
    const r = ui.run;

  }
  // After a restore: pick up this run's record and count the reload.
  function resumeRecord() {
    const r = ui.run;
    let cur = null;
    try { cur = JSON.parse(localStorage.getItem('pegged.current') || 'null'); } catch (e) { cur = null; }
    if (cur && cur.seed === r.seed && cur.result === 'in-progress') {
      ui.rec = cur; ui.recIndex = null;
      if (!r.over) R.reloaded(ui.rec, !!r.blind); // blind kept by the save (v2): not a restart
      // A shop opened by the restore is a new visit (after cash-out it is the first; a v1 save restocked it). A saved
      // shop (v2) is the same visit, untouched.
      if (ui.screen === 'shop' && ui.shopReopened) { R.shopClose(ui.rec, r); R.shopOpen(ui.rec, r); }
      persistRecord();
      return;
    }
    const all = loadRecords(), last = all[all.length - 1];
    if (r.over && last && last.seed === r.seed) { ui.rec = last; ui.recIndex = all.length - 1; return; }
    ui.rec = R.beginMidRun(r); ui.recIndex = null;
    if (last && last.seed === r.seed && last.result === 'lost') {
      // The record ended in a loss but the save is from before the losing deal: a reload during the losing count (B2).
      ui.rec.reloads = 1; ui.rec.reloadsMidBlind = 1; ui.rec.afterRecordedLoss = true;
    }
  }
  function save() {
    try { localStorage.setItem('pegged.save', JSON.stringify(snapshotState())); } catch (e) { /* storage unavailable */ }
    persistRecord();
  }

  function onError(message, phase) {
    try { if (ui.rec) { R.error(ui.rec, ui.run, message, phase || ui.screen); persistRecord(); } } catch (e) { /* never let the record break the page */ }
  }

  function start(data) {
    let ok = restore(data);
    if (!ok) { try { ok = restore(JSON.parse(localStorage.getItem('pegged.save') || 'null')); } catch (e) { ok = false; } }
    if (ok) resumeRecord();
    else { newGame(); ui.overlay = 'rules'; }
    window.addEventListener('error', e => onError(e.message || 'error'));
    window.addEventListener('unhandledrejection', e => onError((e.reason && e.reason.message) || String(e.reason)));
    document.addEventListener('click', onClick);
    document.addEventListener('keydown', onKey);
    document.addEventListener('input', e => {
      if (e.target && e.target.id === 'runNote' && ui.rec) { ui.rec.note = e.target.value.slice(0, 2000); persistRecord(); }
    });

  }

  if (window.claude?.hot?.ready) window.claude.hot.ready(start); else start(window.claude?.hot?.data ?? null);
  window.__pegged = ui; // debugging handle
})();

<script>// Playtest notes button for the hosted Pegged page (orchestrator, 2026-11-22; Beff: "a button in the corner for
// feedback so they can drop notes during play without stopping"). Host layer only: the game's src/ does not know
// about it. Added to the page by tools/pegged-build.js, after ui.js.
// Every note is kept in this browser ('pegged.notes') with where the player was in the run, so nothing is lost
// offline. If window.PEGGED_FEEDBACK.formUrl is set (a Google Form's formResponse URL plus its entry ids), each note
// is also sent there in the background. "Copy my notes" puts all of them on the clipboard as text.
(() => {
  'use strict';
  const CFG = window.PEGGED_FEEDBACK || {};
  const KEY = 'pegged.notes', NAME_KEY = 'pegged.tester';
  const get = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } };
  const set = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
  let notes = get(KEY, []);
  if (!Array.isArray(notes)) notes = [];

  // Where the player is, read from the run record the game keeps in localStorage. Best effort: never throws.
  function context() {
    const c = { build: CFG.build || '', seed: null, at: '' };
    try {
      const rec = JSON.parse(localStorage.getItem('pegged.current') || 'null');
      if (rec) {
        c.build = c.build || rec.buildId || '';
        c.seed = rec.seed;
        const b = rec.blinds && rec.blinds[rec.blinds.length - 1];
        const parts = [];
        if (b && b.ante != null) parts.push('ante ' + b.ante);
        if (b && (b.bossName || b.blindName)) parts.push(String(b.bossName || b.blindName));
        if (b && Array.isArray(b.deals)) parts.push('deal ' + b.deals.length);
        if (rec.lastScreen) parts.push('screen ' + rec.lastScreen);
        c.at = parts.join(', ');
      }
    } catch (e) {}
    return c;
  }

  function send(note) {
    if (!CFG.formUrl || !CFG.fields) return Promise.resolve(false);
    const body = new URLSearchParams();
    const f = CFG.fields;
    if (f.note) body.set(f.note, note.text);
    if (f.name) body.set(f.name, note.name || '');
    if (f.where) body.set(f.where, note.at || '');
    if (f.seed) body.set(f.seed, note.seed == null ? '' : String(note.seed));
    if (f.build) body.set(f.build, note.build || '');
    // no-cors: the form accepts the post but the reply is opaque, so "sent" means "handed to the browser".
    return fetch(CFG.formUrl, { method: 'POST', mode: 'no-cors', body }).then(() => true, () => false);
  }

  const css = `
  .fb-btn{position:fixed;right:max(12px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));z-index:60;
    font:600 15px var(--body,sans-serif);color:var(--ink,#1c1714);background:var(--brass,#d4ad55);border:0;border-radius:999px;
    padding:10px 16px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.45)}
  .fb-btn:focus-visible,.fb-panel button:focus-visible,.fb-panel textarea:focus-visible,.fb-panel input:focus-visible{outline:3px solid var(--ivory,#f3ebdd);outline-offset:2px}
  .fb-panel{position:fixed;right:max(12px,env(safe-area-inset-right));bottom:calc(max(12px,env(safe-area-inset-bottom)) + 52px);z-index:60;
    width:min(340px,calc(100vw - 24px));background:var(--walnut-1,#241912);color:var(--text,#efe4d2);border:1px solid var(--brass-dim,#8f7337);
    border-radius:14px;padding:12px;box-shadow:0 10px 30px rgba(0,0,0,.55);font:15px/1.4 var(--body,sans-serif)}
  .fb-panel[hidden]{display:none}
  .fb-panel h4{margin:0 0 6px;font:400 17px var(--display,serif);color:var(--brass,#d4ad55)}
  .fb-panel label{display:block;font-size:13px;color:var(--muted,#b7a58c);margin-top:6px}
  .fb-panel textarea,.fb-panel input{width:100%;box-sizing:border-box;font:inherit;color:var(--text,#efe4d2);background:var(--walnut-0,#1a120d);
    border:1px solid var(--grain,#4a3424);border-radius:8px;padding:8px}
  .fb-panel textarea{min-height:84px;resize:vertical}
  .fb-row{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
  .fb-panel button{font:600 14px var(--body,sans-serif);border-radius:999px;padding:7px 14px;cursor:pointer;border:1px solid var(--brass-dim,#8f7337);
    background:transparent;color:var(--text,#efe4d2)}
  .fb-panel button.fb-send{background:var(--brass,#d4ad55);color:var(--ink,#1c1714);border-color:transparent}
  .fb-status{font-size:13px;color:var(--muted,#b7a58c);min-height:18px;margin-top:6px}`;
  const style = document.createElement('style'); style.textContent = css; document.head.appendChild(style);

  const btn = document.createElement('button');
  btn.type = 'button'; btn.className = 'fb-btn'; btn.setAttribute('aria-expanded', 'false'); btn.setAttribute('aria-controls', 'fb-panel');
  const panel = document.createElement('div');
  panel.className = 'fb-panel'; panel.id = 'fb-panel'; panel.hidden = true; panel.setAttribute('role', 'dialog'); panel.setAttribute('aria-label', 'Feedback');
  panel.innerHTML = `<h4>Feedback</h4>
    <div style="font-size:13px;color:var(--muted,#b7a58c)">Jot anything: fun, confusing, broken, too hard. Your game keeps going.</div>
    <label for="fb-text">Note</label><textarea id="fb-text" placeholder="What just happened, and how did it feel?"></textarea>
    <label for="fb-name">Your name (remembered)</label><input id="fb-name" maxlength="40" autocomplete="nickname">
    <div class="fb-row"><button type="button" class="fb-send">Save note</button><button type="button" class="fb-copy">Copy my notes</button><button type="button" class="fb-close">Close</button></div>
    <div class="fb-status" aria-live="polite"></div>`;
  document.body.appendChild(panel); document.body.appendChild(btn);
  const text = panel.querySelector('#fb-text'), name = panel.querySelector('#fb-name'), status = panel.querySelector('.fb-status');
  name.value = get(NAME_KEY, '') || '';
  const label = () => { btn.textContent = notes.length ? `Feedback (${notes.length})` : 'Feedback'; };
  label();

  function toggle(open) {
    panel.hidden = !open; btn.setAttribute('aria-expanded', String(open));
    if (open) { status.textContent = ''; text.focus(); } else btn.focus();
  }
  function save() {
    const t = text.value.trim();
    if (!t) { status.textContent = 'Type a note first.'; return; }
    const c = context();
    const note = { text: t, name: name.value.trim(), time: new Date().toISOString(), build: c.build, seed: c.seed, at: c.at, sent: false };
    set(NAME_KEY, note.name);
    notes.push(note); set(KEY, notes); label();
    text.value = '';
    status.textContent = CFG.formUrl ? 'Saved. Sending...' : 'Saved in this browser. Use "Copy my notes" to send them over when you are done.';
    send(note).then(ok => {
      if (ok) { note.sent = true; set(KEY, notes); status.textContent = 'Saved and sent. Thanks!'; }
      else if (CFG.formUrl) status.textContent = 'Saved here, but sending failed. Use "Copy my notes" when you are done.';
    });
    text.focus();
  }
  function asText() {
    return notes.map(n => `[${n.time.slice(0, 16).replace('T', ' ')}] ${n.name || 'anon'}${n.at ? ' (' + n.at + ')' : ''}${n.seed != null ? ' seed ' + n.seed : ''}${n.build ? ' ' + n.build : ''}\n${n.text}`).join('\n\n');
  }
  function copy() {
    if (!notes.length) { status.textContent = 'No notes yet.'; return; }
    const s = asText();
    const done = () => { status.textContent = `Copied ${notes.length} note${notes.length === 1 ? '' : 's'}. Paste them into a message.`; };
    const fallback = () => { const ta = document.createElement('textarea'); ta.value = s; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); done(); } catch (e) { status.textContent = 'Copy failed. Select and copy by hand.'; text.value = s; } ta.remove(); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(s).then(done, fallback); else fallback();
  }

  btn.addEventListener('click', e => { e.stopPropagation(); toggle(panel.hidden); });
  panel.querySelector('.fb-send').addEventListener('click', save);
  panel.querySelector('.fb-copy').addEventListener('click', copy);
  panel.querySelector('.fb-close').addEventListener('click', () => toggle(false));
  // Keep the game's document-level click, key and input handlers from seeing anything that happens in the panel.
  ['click', 'keydown', 'keyup', 'keypress', 'input'].forEach(t => panel.addEventListener(t, e => {
    if (t === 'keydown' && e.key === 'Escape') toggle(false);
    if (t === 'keydown' && e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); save(); }
    e.stopPropagation();
  }));
})();

</script>

</body></html>
